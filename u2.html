let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type='sine', vol=0.3, detune=0, delay=0) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = type; o.frequency.value = freq; o.detune.value = detune;
  const t = audioCtx.currentTime + delay;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur);
}

function playNoise(dur, vol=0.2, delay=0) {
  if (!audioCtx) return;
  const sr = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, sr * dur, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  const g = audioCtx.createGain();
  src.buffer = buf; src.connect(g); g.connect(audioCtx.destination);
  g.gain.value = vol;
  src.start(audioCtx.currentTime + delay);
}

function playLowDrone() {
  if (!audioCtx) return;
  playTone(40, 4, 'sawtooth', 0.12);
  playTone(60, 3, 'square', 0.07, 15);
  playTone(25, 5, 'sine', 0.15);
}

}

function animBanner(canvas) {
  if (bannerAnimId) cancelAnimationFrame(bannerAnimId);
  const ctx = canvas.getContext('2d');
  let t = 0;
  const draw = () => {
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#0a0000'; ctx.fillRect(0,0,W,H);
    for (let i = 0; i < 25; i++) {
      const x = ((i*73 + t*60) % (W+20)) - 10;
      const h = 30 + Math.sin(t+i)*15;
      const grad = ctx.createLinearGradient(x,0,x,h);
      grad.addColorStop(0,'rgba(180,0,0,0)');
      grad.addColorStop(0.5,`rgba(${150+i*3},0,0,0.9)`);
      grad.addColorStop(1,'rgba(80,0,0,0.3)');
      ctx.fillStyle = grad; ctx.fillRect(x,0,3,h);
    }
    t += 0.04;
    bannerAnimId = requestAnimationFrame(draw);
  };
  draw();
}

function handleRefresh() {
  ensureAudio();
  refreshCount++;
  corruption = Math.min(refreshCount, 4);
  
  if (refreshCount <= 2) { playTone(440, 0.2, 'sine', 0.18); }
  else if (refreshCount === 3) { playTone(180, 0.6, 'sawtooth', 0.28, 30); playNoise(0.4,0.15); }
  else { playScream(); startDroneLoop(); addBloodDrips(); }

  if (refreshCount >= 3) triggerGlitch(refreshCount >= 4);

  setTimeout(() => {
    renderYT();
    if (corruption >= 3) startCorruptAnim();
  }, 200);
}

let corruptAnimRunning = false;
function startCorruptAnim() {
  if (corruptAnimRunning) return; corruptAnimRunning = true;
  let t = 0;
  const tick = () => {
    if (!corruptAnimRunning) return;
    t += 0.04;
    ytSim.style.filter = `hue-rotate(${Math.sin(t)*20}deg) saturate(${2.5+Math.sin(t*0.8)*0.8}) contrast(${1.3+Math.sin(t*1.5)*0.15})`;
    requestAnimationFrame(tick);
  };
  tick();
}

  let n = 0;
  const lim = heavy ? 20 : 10;
  const iv = setInterval(() => {
    go.style.opacity = Math.random() > 0.5 ? '1' : '0';

      document.getElementById('browser-window').style.filter = Math.random()>0.5 ? `brightness(${0.3+Math.random()*0.7})` : '';
    }
    if (++n >= lim) {
      clearInterval(iv);
      go.style.opacity = '0';
      ytSim.style.transform = '';
      document.getElementById('browser-window').style.filter = '';
    }

// ======================================================
// THUMBNAIL ANIMATORS — GORE / HORROR VISUALS
// ======================================================
function animateThumbnail(canvas, idx) {
  const ctx = canvas.getContext('2d');
  const W = 200, H = 120;
  let t = 0;
  let reqId;

  const draws = [
    // 0: dissection table
    (t) => {
      ctx.fillStyle = '#0a0000'; ctx.fillRect(0,0,W,H);
      // Table
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(20,60,160,40);
      // Body outline
      ctx.strokeStyle = `rgba(${150+Math.sin(t)*30},50,50,0.9)`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(100,70,55,20,0,0,Math.PI*2); ctx.stroke();
      // Ribs
      for(let r=0;r<5;r++){
        const rx=55+r*18, ry=62+Math.sin(t*2+r)*2;
        ctx.strokeStyle=`rgba(220,200,180,${0.6+Math.sin(t+r)*0.2})`; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-5,ry+16); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(rx+2,ry); ctx.lineTo(rx+7,ry+16); ctx.stroke();
      }
      // Blood pools
      ctx.fillStyle=`rgba(${120+Math.sin(t)*20},0,0,0.85)`;
      ctx.beginPath(); ctx.ellipse(75,88,30+Math.sin(t*0.5)*4,10,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(125,90,22,8,0,0,Math.PI*2); ctx.fill();
      // Drips off table
      for(let d=0;d<4;d++){
        const dx=40+d*35, dh=5+Math.sin(t*2+d)*8;
        ctx.fillStyle='rgba(140,0,0,0.9)'; ctx.fillRect(dx,100,3,dh);
        ctx.beginPath(); ctx.arc(dx+1,100+dh,3,0,Math.PI*2); ctx.fill();
      }
      // ERROR text
      if(Math.sin(t*4)>0.7){
        ctx.fillStyle=`rgba(255,0,0,${Math.abs(Math.sin(t*4))})`;
        ctx.font='bold 11px monospace'; ctx.textAlign='center';
        ctx.fillText('ERROR',100,15); ctx.textAlign='left';
      }
    },
    // 1: skull dissolving in acid
    (t) => {
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
      // Acid pool
      const acid = ctx.createRadialGradient(100,H-20,0,100,H-20,80);
      acid.addColorStop(0,`rgba(80,${180+Math.sin(t*3)*40},0,0.7)`);
      acid.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=acid; ctx.fillRect(0,0,W,H);
      // Skull
      const melt=Math.sin(t*0.4+0.5)*0.5+0.5;
      ctx.fillStyle=`rgba(${220-melt*60},${210-melt*80},${190-melt*100},0.9)`;
      ctx.beginPath(); ctx.ellipse(100,50-melt*5,30,35-melt*10,0,0,Math.PI*2); ctx.fill();
      // Eye sockets
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(87,40,8,8+melt*6,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(113,40,8,8+melt*6,0,0,Math.PI*2); ctx.fill();
      // Drips
      for(let i=0;i<6;i++){
        const dx=72+i*9, dy=70+melt*20+Math.sin(t+i)*5;
        ctx.fillStyle=`rgba(${200-i*10},${160-i*15},${140-i*15},${0.7+melt*0.2})`;
        ctx.fillRect(dx,65,4,dy-65);
        ctx.beginPath(); ctx.arc(dx+2,dy,3+melt*2,0,Math.PI*2); ctx.fill();
      }
      // STATIC overlay
      for(let s=0;s<30;s++){
        ctx.fillStyle=`rgba(0,200,0,${Math.random()*0.15})`;
        ctx.fillRect(Math.random()*W,Math.random()*H,Math.random()*40,1);
      }
      ctx.fillStyle=`rgba(0,${180+Math.sin(t*8)*40},0,0.5)`;
      ctx.font='10px monospace'; ctx.textAlign='center';
      ctx.fillText('REC ●',160,12); ctx.textAlign='left';
    },
    // 2: room with something on the wall
    (t) => {
      ctx.fillStyle='#080004'; ctx.fillRect(0,0,W,H);
      // Room walls perspective
      ctx.strokeStyle='rgba(40,10,10,0.9)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(60,40); ctx.lineTo(140,40); ctx.lineTo(W,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(60,75); ctx.lineTo(140,75); ctx.lineTo(W,H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(60,40); ctx.lineTo(60,75); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(140,40); ctx.lineTo(140,75); ctx.stroke();
      // Something on the wall — writing
      ctx.fillStyle=`rgba(${140+Math.sin(t)*30},0,0,${0.7+Math.sin(t*3)*0.2})`;
      ctx.font='bold 9px monospace'; ctx.textAlign='center';
      ctx.fillText('HELP ME',100,55);
      ctx.fillText('HELP ME',100,63);
      ctx.textAlign='left';
      // Flickering light
      ctx.fillStyle=`rgba(255,${180+Math.sin(t*7)*60},${50+Math.sin(t*5)*30},${0.05+Math.abs(Math.sin(t*6))*0.1})`;
      ctx.fillRect(0,0,W,H);
      // Figure in doorway
      const fx=100, fy=57;
      ctx.fillStyle=`rgba(0,0,0,${0.8+Math.sin(t*0.3)*0.15})`;
      ctx.beginPath(); ctx.ellipse(fx,fy-18,9,12,0,0,Math.PI*2); ctx.fill();
      ctx.fillRect(fx-7,fy-7,14,22);
      // Eye glow
      ctx.fillStyle=`rgba(255,0,0,${0.6+Math.sin(t*4)*0.4})`;
      ctx.beginPath(); ctx.arc(fx-3,fy-20,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(fx+3,fy-20,2,0,Math.PI*2); ctx.fill();
    },
    // 3: hands reaching through screen
    (t) => {
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
      // Screen glow
      ctx.fillStyle=`rgba(20,0,0,${0.3+Math.sin(t*2)*0.1})`; ctx.fillRect(0,0,W,H);
      // Multiple hands from bottom
      for(let h=0;h<3;h++){
        const hx=40+h*60, hy=H-(30+Math.sin(t*1.5+h)*20);
        // Arm
        ctx.fillStyle=`rgba(${120+h*15},${45+h*8},${40+h*5},0.95)`;
        ctx.fillRect(hx-10,hy,20,H-hy+5);
        // Palm
        ctx.beginPath(); ctx.ellipse(hx,hy,16,12,0,0,Math.PI*2); ctx.fill();
        // Fingers
        const fa=[-0.3,-0.1,0.1,0.3];
        fa.forEach((a,fi)=>{
          ctx.save(); ctx.translate(hx-12+fi*8,hy-2); ctx.rotate(a-Math.PI/2);
          ctx.fillRect(-3,0,6,20+Math.sin(t*2+fi)*4);
          // Nail
          ctx.fillStyle='rgba(20,10,10,0.9)'; ctx.fillRect(-3,0,6,7);
          ctx.restore();
          ctx.fillStyle=`rgba(${120+h*15},${45+h*8},${40+h*5},0.95)`;
        });
        // Blood drips from fingers
        ctx.fillStyle=`rgba(${150+h*10},0,0,0.9)`;
        ctx.beginPath(); ctx.arc(hx,hy+12,5+Math.sin(t*3+h)*2,0,Math.PI*2); ctx.fill();
      }
      // Crack lines in screen
      ctx.strokeStyle='rgba(255,0,0,0.5)'; ctx.lineWidth=1;
      for(let c=0;c<5;c++){
        ctx.beginPath();
        ctx.moveTo(80+c*8,0);
        ctx.lineTo(70+c*12+Math.sin(t+c)*10,H);
        ctx.stroke();
      }
    },
    // 4: final — darkness with face emerging
    (t) => {
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
      const pulse=Math.abs(Math.sin(t*2.5));
      // Pulsing red glow center
      const g=ctx.createRadialGradient(100,60,0,100,60,80);
      g.addColorStop(0,`rgba(${80+pulse*60},0,0,${pulse*0.5})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      // Face — barely visible
      const alpha=0.3+pulse*0.4;
      ctx.fillStyle=`rgba(${140+pulse*40},${60+pulse*20},${50+pulse*20},${alpha})`;
      ctx.beginPath(); ctx.ellipse(100,60,35,42,0,0,Math.PI*2); ctx.fill();
      // Eyes — glowing red
      ctx.fillStyle=`rgba(255,0,0,${0.7+pulse*0.3})`;
      ctx.beginPath(); ctx.ellipse(86,52,10,6,0.2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(114,52,10,6,-0.2,0,Math.PI*2); ctx.fill();
      // Pupils
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(86,52,4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(114,52,4,0,Math.PI*2); ctx.fill();
      // Mouth — sewn shut
      ctx.strokeStyle=`rgba(${60+pulse*40},0,0,0.9)`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(76,72); ctx.lineTo(124,72); ctx.stroke();
      for(let s=0;s<5;s++){
        const sx=82+s*9;
        ctx.strokeStyle=`rgba(180,${50+s*10},0,0.8)`; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(sx,68); ctx.lineTo(sx+2,76); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx+4,68); ctx.lineTo(sx+2,76); ctx.stroke();
      }
      // Static
      for(let s=0;s<40;s++){
        ctx.fillStyle=`rgba(${Math.random()>0.5?255:0},0,0,${Math.random()*0.3})`;
        ctx.fillRect(Math.random()*W,Math.random()*H,Math.random()*6+1,1);
      }
      ctx.fillStyle=`rgba(255,0,0,${pulse*0.8})`;
      ctx.font='bold 10px monospace'; ctx.textAlign='center';
      ctx.fillText('DO NOT CLICK',100,108);
      ctx.fillText('DO NOT CLICK',100,108);
      ctx.textAlign='left';
    }
  ];

  const draw = () => {
    t += 0.04;
    draws[idx](t);
    reqId = requestAnimationFrame(draw);
  };
  draw();
  return reqId;
}

        for(let s=0;s<200;s++){
          ctx.fillStyle=`rgba(${Math.random()*255},0,0,${Math.random()*0.6})`;
          ctx.fillRect(Math.random()*W,Math.random()*H,Math.random()*20,Math.random()*4);
        }
      }
    },

    // VIDEO 1: Acid/Decay vat — found footage
    (t) => {
      ctx.fillStyle='#000804'; ctx.fillRect(0,0,W,H);
      // Night-vision green tint
      ctx.fillStyle=`rgba(0,${30+Math.sin(t)*8},0,0.2)`; ctx.fillRect(0,0,W,H);
      // Vat
      ctx.fillStyle='#0a0a0a'; ctx.fillRect(150,200,560,220);
      ctx.strokeStyle='rgba(40,60,40,0.9)'; ctx.lineWidth=4;
      ctx.strokeRect(150,200,560,220);
      // Acid surface
      const acidCol=`rgba(60,${160+Math.sin(t*3)*30},20,0.7)`;
      ctx.fillStyle=acidCol;
      ctx.fillRect(155,205,550,20);
      // Bubbles
      for(let b=0;b<15;b++){
        const bx=180+b*35, by=200+Math.sin(t*2+b)*5;
        ctx.fillStyle=`rgba(80,${180+Math.sin(t*5+b)*40},30,0.5)`;
        ctx.beginPath(); ctx.arc(bx,by,3+Math.sin(t*3+b)*2,0,Math.PI*2); ctx.fill();
      }
      // Something dissolving in acid
      const dissolve=Math.sin(t*0.2+0.5)*0.5+0.5;
      ctx.fillStyle=`rgba(${180-dissolve*80},${100-dissolve*60},${90-dissolve*60},${0.9-dissolve*0.4})`;
      ctx.beginPath(); ctx.ellipse(430,280,130-dissolve*50,60-dissolve*30,0,0,Math.PI*2); ctx.fill();
      // Bones showing through
      for(let bone=0;bone<4;bone++){
        ctx.strokeStyle=`rgba(220,200,170,${dissolve*0.8})`; ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(330+bone*40,260);
        ctx.bezierCurveTo(320+bone*40,290,340+bone*40,310,330+bone*40,330);
        ctx.stroke();
      }
      // Acid eating at edges
      for(let e=0;e<8;e++){
        ctx.fillStyle=`rgba(80,${180+Math.sin(t*4+e)*30},20,${0.3+Math.sin(t*2+e)*0.2})`;
        ctx.beginPath();
        ctx.arc(300+e*26,310+Math.sin(t+e)*15,8+Math.sin(t*3+e)*4,0,Math.PI*2);
        ctx.fill();
      }
      // Noise scan lines
      for(let y=0;y<H;y+=3){
        if(Math.random()>0.8){
          ctx.fillStyle=`rgba(0,${Math.random()*120},0,${Math.random()*0.3})`;
          ctx.fillRect(0,y,W,2);
        }
      }
      // Timestamp green
      ctx.fillStyle=`rgba(0,${200+Math.sin(t*8)*40},0,0.9)`;
      ctx.font='bold 14px monospace';
      ctx.fillText(`⬤ REC  ${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`,20,H-20);
      ctx.fillText('STORAGE B / SUBLEVEL 3',W-280,H-20);
    },

    // VIDEO 2: Faces — Multiple corrupted faces
    (t) => {
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
      // Heavy static
      for(let y=0;y<H;y+=2){
        const r=Math.random();
        if(r>0.6){
          ctx.fillStyle=`rgba(${Math.random()*100},0,0,${Math.random()*0.5})`;
          ctx.fillRect(0,y,Math.random()*W,2);
        }
      }
      // Three melting faces
      for(let fi=0;fi<3;fi++){
        const fx=140+fi*200, fy=160;
        const melt=Math.sin(t*0.6+fi)*0.5+0.5;
        // Face
        ctx.fillStyle=`rgba(${200-melt*60-fi*15},${110-melt*40},${90-melt*30},0.9)`;
        ctx.beginPath(); ctx.ellipse(fx,fy,60+melt*10,75-melt*15,0,0,Math.PI*2); ctx.fill();
        // Eyes — one normal, one wrong
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.ellipse(fx-20,fy-20,14,10+melt*6,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(fx+20,fy-20,14,10+melt*6,0,0,Math.PI*2); ctx.fill();
        // Iris
        ctx.fillStyle=fi===0?'#8b0000':fi===1?'rgba(255,200,0,0.9)':'#000';
        ctx.beginPath(); ctx.arc(fx-20,fy-20,8,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(fx+20+Math.sin(t+fi)*3,fy-20,8,0,Math.PI*2); ctx.fill();
        // Pupils
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(fx-20,fy-20,4+melt*2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(fx+20+Math.sin(t+fi)*3,fy-20,4+melt*2,0,Math.PI*2); ctx.fill();
        // Mouth — screaming
        ctx.fillStyle='rgba(20,0,0,0.95)';
        ctx.beginPath();
        ctx.ellipse(fx,fy+25+melt*15,20+melt*10,15+melt*20,0,0,Math.PI*2);
        ctx.fill();
        // Teeth in mouth
        ctx.fillStyle='rgba(220,210,190,0.9)';
        for(let tooth=0;tooth<5;tooth++){
          ctx.fillRect(fx-18+tooth*9,fy+20+melt*10,7,8+melt*4);
          ctx.fillRect(fx-18+tooth*9,fy+38+melt*20,7,-(8+melt*4));
        }
        // Melting flesh drips
        for(let d=0;d<8;d++){
          const dx=fx-28+d*8;
          const dh=20+Math.sin(t*0.5+d+fi)*25+melt*40;
          const r=200-fi*20-d*5, g=80-fi*10, b=60-fi*5;
          ctx.fillStyle=`rgba(${r},${g},${b},0.85)`;
          ctx.fillRect(dx-2,fy+60,5,dh);
          ctx.beginPath(); ctx.arc(dx,fy+60+dh,4+melt*2,0,Math.PI*2); ctx.fill();
        }
        // Blood from eyes
        ctx.fillStyle='rgba(160,0,0,0.9)';
        ctx.fillRect(fx-22,fy-18,3,20+melt*20);
        ctx.fillRect(fx+18,fy-18,3,20+melt*20);
      }
      // Glitch horizontal tears
      for(let g=0;g<4;g++){
        if(Math.random()>0.7){
          const gy=Math.random()*H;
          ctx.drawImage(ctx.canvas,0,gy,W,10,Math.random()*20-10,gy,W,10);
          ctx.fillStyle=`rgba(255,0,0,0.15)`;
          ctx.fillRect(0,gy,W,10);
        }
      }
      ctx.fillStyle=`rgba(255,0,0,${0.5+Math.sin(t*8)*0.3})`;
      ctx.font='bold 18px monospace'; ctx.textAlign='center';
      ctx.fillText('DO NOT ADJUST YOUR MONITOR',W/2,H-25);
      ctx.textAlign='left';
    },

    // VIDEO 3: Church ritual — bones and fire
    (t) => {
      ctx.fillStyle='#020008'; ctx.fillRect(0,0,W,H);
      // Candles arranged in circle
      const numCandles=12;
      for(let c=0;c<numCandles;c++){
        const angle=(c/numCandles)*Math.PI*2;
        const cx=430+Math.cos(angle)*200;
        const cy=250+Math.sin(angle)*130;
        const flicker=Math.sin(t*8+c*1.4)*6;
        // Candle light
        const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,80+flicker);
        cg.addColorStop(0,`rgba(255,${150+Math.sin(t*4+c)*40},30,${0.35+Math.sin(t*3+c)*0.1})`);
        cg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=cg; ctx.fillRect(cx-90,cy-90,180,180);
        // Body
        ctx.fillStyle='#ccccaa'; ctx.fillRect(cx-5,cy-35,10,40);
        // Flame
        ctx.fillStyle=`rgba(255,${140+Math.sin(t*10+c)*50},0,0.9)`;
        ctx.beginPath();
        ctx.moveTo(cx,cy-40);
        ctx.quadraticCurveTo(cx+flicker*0.4,cy-55,cx,cy-68+Math.abs(flicker)*0.5);
        ctx.quadraticCurveTo(cx-flicker*0.4,cy-55,cx,cy-40);
        ctx.fill();
      }
      // Central pentagram
      const pr=120;
      ctx.strokeStyle=`rgba(${150+Math.sin(t)*40},0,0,${0.7+Math.sin(t*2)*0.2})`; ctx.lineWidth=3;
      for(let p=0;p<5;p++){
        const a1=(p*4*Math.PI/5)-Math.PI/2+t*0.05;
        const a2=((p+2)*4*Math.PI/5)-Math.PI/2+t*0.05;
        ctx.beginPath();
        ctx.moveTo(430+Math.cos(a1)*pr,250+Math.sin(a1)*pr);
        ctx.lineTo(430+Math.cos(a2)*pr,250+Math.sin(a2)*pr);
        ctx.stroke();
      }
      // Altar bones
      ctx.fillStyle='rgba(210,195,165,0.9)';
      // Skull on altar
      ctx.beginPath(); ctx.ellipse(430,310,30,25,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#020008';
      ctx.beginPath(); ctx.ellipse(418,306,8,9,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(442,306,8,9,0,0,Math.PI*2); ctx.fill();
      // Spine
      for(let v=0;v<8;v++){
        ctx.fillStyle=`rgba(210,195,165,${0.8+Math.sin(t+v)*0.1})`;
        ctx.beginPath(); ctx.ellipse(430,340+v*12,10,6,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#020008';
        ctx.fillRect(429,344+v*12,2,8);
      }
      // Blood on floor radiating from center
      const bloodGrad=ctx.createRadialGradient(430,250,0,430,250,200);
      bloodGrad.addColorStop(0,`rgba(${100+Math.sin(t)*20},0,0,${0.4+Math.sin(t*0.5)*0.1})`);
      bloodGrad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=bloodGrad; ctx.fillRect(0,0,W,H);
      // Latin text
      ctx.fillStyle=`rgba(255,0,0,${0.6+Math.sin(t*6)*0.3})`;
      ctx.font=`${16+Math.sin(t)*2}px serif`; ctx.textAlign='center';
      const chants=['IN NOMINE BESTIAE','PORTA APERTA EST','VENITE AD ME OMNES','NON POSSUMUS EXIRE'];
      ctx.fillText(chants[Math.floor(t*0.4)%4],W/2,H-40);
      ctx.font='14px serif';
      ctx.fillText('ET LUMEN EXTINCTUM EST',W/2,H-20);
      ctx.textAlign='left';
      // Dark smoky overlay
      for(let sm=0;sm<6;sm++){
        const sg=ctx.createRadialGradient(Math.random()*W,Math.random()*H,0,Math.random()*W,Math.random()*H,120);
        sg.addColorStop(0,'rgba(0,0,0,0.15)'); sg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
      }
    },

    // VIDEO 4: THE FINAL — black with text and then HAND
    (t) => {
      ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
      // Heavy static
      for(let s=0;s<400;s++){
        ctx.fillStyle=`rgba(${Math.random()*60},0,0,${Math.random()*0.4})`;
        ctx.fillRect(Math.random()*W,Math.random()*H,Math.random()*8,Math.random()*3);
      }
      // Phase 1: text
      if(t<4){
        ctx.fillStyle=`rgba(255,0,0,${Math.min(1,t/1.5)*(0.7+Math.sin(t*6)*0.3)})`;
        ctx.font=`bold ${40+Math.sin(t*2)*4}px monospace`; ctx.textAlign='center';
        ctx.fillText('IT IS WATCHING',W/2,H/2-30);
        ctx.font=`bold ${20+Math.sin(t*3)*2}px monospace`;
        ctx.fillStyle=`rgba(255,255,255,${Math.min(1,(t-1)/2)*0.7})`;
        ctx.fillText('THERE IS NO ESCAPE',W/2,H/2+20);
      }
      // Phase 2: hand emerges + more text
      if(t>=3){
        const handP=Math.min(1,(t-3)/5);
        const handY=H-(handP*H*0.85);
        // Bloody arm up
        ctx.fillStyle=`rgba(${120+Math.sin(t)*15},${40+Math.sin(t*0.5)*8},35,0.97)`;
        ctx.fillRect(W/2-45,handY+80,90,H-handY);
        // Palm
        ctx.beginPath(); ctx.ellipse(W/2,handY+70,70,50,0,0,Math.PI*2); ctx.fill();
        // Fingers
        const fAngles=[-0.45,-0.18,0,0.18,0.4];
        const fLens=[100,130,145,130,105];
        fAngles.forEach((fa,fi)=>{
          ctx.save();
          ctx.translate(W/2-40+fi*20,handY+30);
          ctx.rotate(fa-Math.PI/2);
          ctx.fillStyle=`rgba(${125+fi*6},${42+fi*4},38,0.96)`;
          ctx.fillRect(-8,0,16,fLens[fi]+Math.sin(t*2+fi)*6);
          // Nail — black cracked
          ctx.fillStyle='rgba(15,8,8,0.95)';
          ctx.fillRect(-7,0,14,22);
          ctx.strokeStyle='rgba(60,0,0,0.6)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(-2,5); ctx.lineTo(-2,18); ctx.stroke();
          ctx.restore();
          ctx.fillStyle=`rgba(${120+fi*6},${40+fi*4},35,0.97)`;
        });
        // Veins on arm
        ctx.strokeStyle=`rgba(80,0,0,${0.6+Math.sin(t)*0.2})`; ctx.lineWidth=2;
        for(let v=0;v<5;v++){
          ctx.beginPath();
          ctx.moveTo(W/2-30+v*12,handY+100);
          ctx.bezierCurveTo(
            W/2-30+v*12+Math.sin(t+v)*6,handY+160,
            W/2-30+v*12-Math.sin(t+v)*6,handY+220,
            W/2-30+v*12+Math.sin(t+v)*4,H
          );
          ctx.stroke();
        }
        // Blood dripping from fingertips
        fAngles.forEach((fa,fi)=>{
          const bx=W/2-40+fi*20;
          const by=handY+30-fLens[fi]-22;
          for(let d=0;d<3;d++){
            const bh=10+Math.sin(t*3+fi+d)*15+handP*30;
            ctx.fillStyle='rgba(160,0,0,0.95)';
            ctx.fillRect(bx+d*3-3,by,3,bh);
            ctx.beginPath(); ctx.arc(bx+d*3-1,by+bh,4,0,Math.PI*2); ctx.fill();
          }
        });
        // Blood spreading on ground
        const bg=ctx.createRadialGradient(W/2,H,0,W/2,H,300*handP);
        bg.addColorStop(0,`rgba(${90+Math.sin(t)*15},0,0,${handP*0.8})`);
        bg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
      }
      // Phase 3: face behind hand
      if(t>=5){
        const fa2=Math.min(1,(t-5)/3);
        ctx.fillStyle=`rgba(${100+Math.sin(t*3)*30},${30+Math.sin(t)*10},25,${fa2*0.5})`;
        ctx.beginPath(); ctx.ellipse(W/2,H/2-50,120,140,0,0,Math.PI*2); ctx.fill();
        // Eyes glowing
        ctx.fillStyle=`rgba(255,0,0,${fa2*(0.7+Math.sin(t*5)*0.3)})`;
        ctx.beginPath(); ctx.ellipse(W/2-40,H/2-80,25,16,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(W/2+40,H/2-80,25,16,0,0,Math.PI*2); ctx.fill();
      }
      ctx.textAlign='left';
      // Scanlines
      ctx.fillStyle='rgba(0,0,0,0.15)';
      for(let sl=0;sl<H;sl+=4){ ctx.fillRect(0,sl,W,2); }
    }
  ];

  let lastT = performance.now();
  const draw = () => {
    const now = performance.now();
    t = (now - startMs) / 1000;
    if (!videoPaused) renders[idx](t);
    videoAnimId = requestAnimationFrame(draw);
  };
  draw();
}

function startVideoTimer() {
  if (videoTimerHandle) clearInterval(videoTimerHandle);
  videoTimerHandle = setInterval(() => {
    if (videoPaused) return;
    videoTimeSec += 0.5;
    if (videoTimeSec > videoTotalSec) videoTimeSec = videoTotalSec;
    const pct = videoTimeSec / videoTotalSec;
    document.getElementById('progress-bar').style.width = (pct * 100) + '%';
    const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    document.getElementById('video-time').textContent = `${fmt(videoTimeSec)} / ${fmt(videoTotalSec)}`;
  }, 500);
}

// ======================================================
// POPUP — blank window before last video
// ======================================================
function showPopup(videoIdx) {
  ensureAudio();
  popupShown = true;
  playTone(300, 0.4, 'square', 0.15);

  document.getElementById('popup-title-text').textContent = '\u00a0';
  document.getElementById('popup-content').innerHTML = '<p style="color:#333;font-size:12px;font-family:\'Courier New\',monospace">&nbsp;</p>';
  document.getElementById('popup-overlay').style.display = 'flex';

  const ok = document.getElementById('popup-ok-btn');
  const cl = document.getElementById('popup-close-btn');
  const handler = () => {
    document.getElementById('popup-overlay').style.display = 'none';
    playClick();
    openVideo(videoIdx);
  };
  ok.onclick = handler;
  cl.onclick = handler;
}

// ======================================================
// ENDING / SCREAMER
// ======================================================
function triggerEnding() {
  if (endingStarted) return;
  endingStarted = true;
  ensureAudio();
  playHeavyScream();

  stopVideo();

  const sc = document.getElementById('screamer-overlay');
  sc.style.display = 'flex';
  const canvas = document.getElementById('screamer-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  let t = 0;
  let phase = 0;
  let lastSnd = 0;

  const drawScreamer = () => {
    t += 0.03;

    // Phase transitions
    if (t > 3 && phase < 1) phase = 1;
    if (t > 7 && phase < 2) { phase = 2; playHeavyScream(); }
    if (t > 11 && phase < 3) { phase = 3; }
    if (t > 14) {
      // Final black
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = `rgba(255,0,0,${Math.abs(Math.sin(t*3))*0.5})`;
      ctx.font = `bold ${50+Math.sin(t*5)*8}px monospace`; ctx.textAlign = 'center';
      ctx.fillText('⛧', W/2, H/2+20);
      ctx.font = '20px monospace';
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0,Math.sin(t*2)*0.5)})`;
      ctx.fillText('[ NO SIGNAL ]', W/2, H/2+70);
      ctx.textAlign = 'left';
      requestAnimationFrame(drawScreamer);
      return;
    }

    // Sound pulses
    if (t - lastSnd > 0.3 + Math.random() * 0.4) {
      lastSnd = t;
      if (audioCtx) {
        playTone(30 + Math.random() * 200, 0.3, 'sawtooth', 0.4, Math.random() * 200 - 100);
        playNoise(0.2, 0.3);
      }
    }

    if (phase === 0) {
      // Heavy static + flashing red
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
      // Full static
      const id = ctx.createImageData(W, H);
      const data = id.data;
      for (let i = 0; i < data.length; i += 4) {
        const v = Math.random() * 80;
        data[i] = v + Math.random() * 100;
        data[i+1] = 0;
        data[i+2] = 0;
        data[i+3] = 255;
      }
      ctx.putImageData(id, 0, 0);
      // Red flashes
      if (Math.random() > 0.5) {
        ctx.fillStyle = `rgba(255,0,0,${Math.random() * 0.7})`;
        ctx.fillRect(0,0,W,H);
      }
      ctx.fillStyle = `rgba(255,0,0,${0.6+Math.sin(t*20)*0.4})`;
      ctx.font = `bold ${60+Math.sin(t*10)*15}px monospace`; ctx.textAlign = 'center';
      ctx.fillText('IT FOUND YOU', W/2, H/3);
      ctx.textAlign = 'left';

    } else if (phase === 1) {
      // Screamer face
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);

      // Rapid flash between static and face
      if (Math.sin(t * 15) > 0) {
        // SCREAMER FACE — distorted horror face
        const faceX = W/2, faceY = H/2;
        const pulse = Math.abs(Math.sin(t * 8));

        // Face background glow
        const fg = ctx.createRadialGradient(faceX, faceY, 0, faceX, faceY, 350);
        fg.addColorStop(0, `rgba(${100+pulse*80},0,0,0.9)`);
        fg.addColorStop(0.5, `rgba(${50+pulse*30},0,0,0.6)`);
        fg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = fg; ctx.fillRect(0,0,W,H);

        // Skin — pale decayed
        ctx.fillStyle = `rgba(${180+pulse*30},${130+pulse*20},${100+pulse*15},0.97)`;
        ctx.beginPath(); ctx.ellipse(faceX, faceY-30, 200+pulse*20, 240+pulse*25, 0, 0, Math.PI*2); ctx.fill();

        // Forehead cracks
        ctx.strokeStyle = 'rgba(60,0,0,0.8)'; ctx.lineWidth = 3;
        for (let c = 0; c < 8; c++) {
          ctx.beginPath();
          ctx.moveTo(faceX - 80 + c * 22, faceY - 200);
          ctx.bezierCurveTo(
            faceX - 80 + c * 22 + Math.sin(t + c) * 15, faceY - 150,
            faceX - 80 + c * 22 - Math.sin(t + c) * 15, faceY - 100,
            faceX - 80 + c * 22 + Math.sin(t * 2 + c) * 10, faceY - 60
          );
          ctx.stroke();
        }

        // Eyes — WIDE open all-white
        // Left eye
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(faceX-75, faceY-80, 55+pulse*10, 45+pulse*8, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(faceX+75, faceY-80, 55+pulse*10, 45+pulse*8, 0, 0, Math.PI*2); ctx.fill();
        // Irises — completely bloodshot
        const irisR = 22 + pulse * 5;
        ctx.fillStyle = `rgba(${180+pulse*40},0,0,0.95)`;
        ctx.beginPath(); ctx.arc(faceX-75+Math.sin(t*3)*8, faceY-80+Math.cos(t*2)*6, irisR, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(faceX+75-Math.sin(t*3)*8, faceY-80+Math.cos(t*2)*6, irisR, 0, Math.PI*2); ctx.fill();
        // Pupils — huge dilated
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(faceX-75+Math.sin(t*3)*8, faceY-80+Math.cos(t*2)*6, 14+pulse*4, 0, Math.PI*2); ctx.fill();
